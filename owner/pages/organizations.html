<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Organizations | Gracextol CBT</title>

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- OWNER CSS -->
    <link
        rel="stylesheet"
        href="../css/owner.css"
    >

    <!-- ORGANIZATIONS CSS -->
    <link
        rel="stylesheet"
        href="../css/organizations.css"
    >
</head>

<body>

    <main class="organizations-page">

        <!-- HEADER -->
        <header class="organizations-header">

            <div class="organizations-header-left">

                <div class="organizations-header-logo">
                    <img
                        src="../../assets/images/graextolcbt-logo.png"
                        alt="Gracextol CBT"
                    >
                </div>

                <div>
                    <h1>Organizations</h1>

                    <p>
                        Review, approve and manage organizations on
                        Gracextol CBT.
                    </p>
                </div>

            </div>

        </header>

        <!-- ORGANIZATION MANAGEMENT -->
        <section class="organizations-list-card">

            <!-- SECTION HEADER -->
            <div class="organizations-list-top">

                <div>
                    <h2>Organization Management</h2>

                    <p class="list-description">
                        Review organization registrations, view their
                        administrators and teachers, and manage access.
                    </p>
                </div>

                <span
                    id="organizationCount"
                    class="organization-count"
                >
                    0 Organizations
                </span>

            </div>

            <!-- STATUS FILTERS -->
            <div class="organization-filters">

                <button
                    type="button"
                    class="organization-filter active"
                    data-status="all"
                >
                    All
                </button>

                <button
                    type="button"
                    class="organization-filter"
                    data-status="pending"
                >
                    Pending
                </button>

                <button
                    type="button"
                    class="organization-filter"
                    data-status="active"
                >
                    Active
                </button>

                <button
                    type="button"
                    class="organization-filter"
                    data-status="inactive"
                >
                    Inactive
                </button>

                <button
                    type="button"
                    class="organization-filter"
                    data-status="rejected"
                >
                    Rejected
                </button>

            </div>

            <!-- ORGANIZATIONS TABLE -->
            <div class="table-wrapper">

                <table class="organizations-table">

                    <thead>
                        <tr>
                            <th>Organization</th>
                            <th>Administrator</th>
                            <th>Teachers</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="organizationsTableBody">
                        <tr>
                            <td colspan="6">
                                <i class="fa-solid fa-spinner fa-spin"></i>
                                Loading organizations...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../../assets/js/supabase-client.js"></script>

    <!-- ORGANIZATIONS JAVASCRIPT -->
    <script src="../js/organizations.js"></script>

</body>

</html>

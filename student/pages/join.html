<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Join Examination | Gracextol CBT</title>


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         EXISTING STUDENT CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >


    <!-- =====================================================
         JOIN EXAMINATION PAGE CSS
    ====================================================== -->

    <style>

        /* =====================================================
           PAGE
        ====================================================== */

        .join-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;
        }


        /* =====================================================
           MAIN CARD
        ====================================================== */

        .join-card {
            width: min(100%, 520px);

            padding: 38px;

            background: #ffffff;

            border: 1px solid #e2e8f0;

            border-radius: 22px;

            box-shadow:
                0 20px 55px rgba(30, 41, 59, 0.10);
        }


        /* =====================================================
           BRAND
        ====================================================== */

        .join-brand {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 12px;

            margin-bottom: 30px;
        }

        .join-brand img {
            width: 48px;
            height: 48px;

            object-fit: contain;
        }

        .join-brand h1 {
            margin: 0;

            color: #17203f;

            font-size: 23px;
            font-weight: 800;
        }

        .join-brand h1 span {
            color: #7c3aed;
        }


        /* =====================================================
           ICON
        ====================================================== */

        .join-icon {
            width: 68px;
            height: 68px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: #ede9fe;

            color: #7c3aed;

            font-size: 28px;
        }


        /* =====================================================
           TITLE
        ====================================================== */

        .join-card h2 {
            margin: 0;

            text-align: center;

            color: #17203f;

            font-size: 27px;
            font-weight: 800;
        }


        /* =====================================================
           SUBTITLE
        ====================================================== */

        .join-subtitle {
            margin: 9px auto 25px;

            max-width: 410px;

            text-align: center;

            color: #64748b;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =====================================================
           EXAMINATION PREVIEW
        ====================================================== */

        .exam-preview {
            display: none;

            margin-bottom: 22px;

            padding: 18px;

            border: 1px solid #ddd6fe;

            border-radius: 14px;

            background: #faf5ff;

            text-align: left;
        }


        .exam-preview-title {
            margin: 0 0 10px;

            color: #5b21b6;

            font-size: 18px;

            font-weight: 800;
        }


        .exam-preview-details {
            margin: 0;

            color: #475569 !important;

            font-size: 13px;

            line-height: 1.7;
        }


        /* =====================================================
           EXAMINATION PREVIEW WHEN JAVASCRIPT HAS LOADED IT
        ====================================================== */

        #examPreview[style*="block"] {
            display: block !important;
        }


        /* =====================================================
           FORM GROUP
        ====================================================== */

        .join-form-group {
            margin-bottom: 18px;
        }


        /* =====================================================
           LABEL
        ====================================================== */

        .join-form-group label {
            display: block;

            margin-bottom: 8px;

            color: #334155 !important;

            font-size: 13px;

            font-weight: 700;
        }


        /* =====================================================
           INPUT WRAPPER
        ====================================================== */

        .join-input-wrap {
            position: relative;
        }


        /* =====================================================
           INPUT ICON
        ====================================================== */

        .join-input-wrap i {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #64748b !important;

            z-index: 2;

            pointer-events: none;
        }


        /* =====================================================
           FULL NAME INPUT
        ====================================================== */

        .join-input {
            width: 100%;

            height: 50px;

            padding: 0 15px 0 45px;

            border: 1px solid #dbe3f5 !important;

            border-radius: 12px;

            outline: none;

            color: #17203f !important;

            background: #ffffff !important;

            -webkit-text-fill-color: #17203f !important;

            font-family: inherit;

            font-size: 14px;

            font-weight: 500;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        /* =====================================================
           PLACEHOLDER
        ====================================================== */

        .join-input::placeholder {
            color: #94a3b8 !important;

            opacity: 1 !important;

            -webkit-text-fill-color: #94a3b8 !important;
        }


        /* =====================================================
           INPUT FOCUS
        ====================================================== */

        .join-input:focus {
            border-color: #7c3aed !important;

            background: #ffffff !important;

            color: #17203f !important;

            -webkit-text-fill-color: #17203f !important;

            box-shadow:
                0 0 0 3px rgba(124, 58, 237, 0.10);
        }


        /* =====================================================
           START EXAMINATION BUTTON
        ====================================================== */

        .join-button {
            width: 100%;

            height: 51px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            border: 0;

            border-radius: 12px;

            background: #7c3aed;

            color: #ffffff !important;

            font-family: inherit;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .join-button:hover {
            background: #6d28d9;

            transform: translateY(-1px);
        }


        .join-button:disabled {
            opacity: 0.7;

            cursor: not-allowed;

            transform: none;
        }


        /* =====================================================
           VERIFICATION / ERROR MESSAGE
        ====================================================== */

        #joinMessage {
            min-height: 20px;

            margin-top: 14px;

            padding: 0 5px;

            text-align: center;

            font-size: 13px;

            font-weight: 600;

            color: #15803d !important;
        }


        /* =====================================================
           FOOTER
        ====================================================== */

        .join-footer {
            margin-top: 25px;

            text-align: center;

            color: #94a3b8 !important;

            font-size: 11px;
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 560px) {

            .join-card {
                padding: 28px 20px;

                border-radius: 18px;
            }


            .join-card h2 {
                font-size: 23px;
            }


            .exam-preview {
                padding: 15px;
            }


            .exam-preview-title {
                font-size: 17px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND DECORATIONS
    ====================================================== -->

    <div class="bg-shape shape-one"></div>

    <div class="bg-shape shape-two"></div>



    <!-- =====================================================
         MAIN JOIN PAGE
    ====================================================== -->

    <main class="join-page">

        <section class="join-card">


            <!-- =================================================
                 BRAND
            ================================================== -->

            <div class="join-brand">

                <img
                    src="../../assets/images/graextolcbt-logo.png"
                    alt="Gracextol CBT Logo"
                >

                <h1>
                    GRACEXTOL
                    <span>CBT</span>
                </h1>

            </div>



            <!-- =================================================
                 JOIN ICON
            ================================================== -->

            <div class="join-icon">

                <i class="fa-solid fa-pen-to-square"></i>

            </div>



            <!-- =================================================
                 PAGE TITLE
            ================================================== -->

            <h2>
                Join Examination
            </h2>



            <!-- =================================================
                 DESCRIPTION
            ================================================== -->

            <p class="join-subtitle">

                You have been invited to take an examination.
                Confirm the examination details below and enter
                your full name to continue.

            </p>



            <!-- =================================================
                 EXAMINATION INFORMATION
            ================================================== -->

            <div
                class="exam-preview"
                id="examPreview"
            >

                <h3
                    class="exam-preview-title"
                    id="examTitle"
                >
                    Loading examination...
                </h3>


                <p
                    class="exam-preview-details"
                    id="examDetails"
                >
                    Please wait while we verify your examination.
                </p>

            </div>



            <!-- =================================================
                 JOIN FORM
            ================================================== -->

            <form id="joinForm">


                <!-- =============================================
                     FULL NAME
                ============================================== -->

                <div class="join-form-group">

                    <label for="studentName">

                        <i class="fa-solid fa-user"></i>

                        Full Name

                    </label>


                    <div class="join-input-wrap">

                        <i class="fa-solid fa-user"></i>


                        <input
                            type="text"
                            id="studentName"
                            class="join-input"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            maxlength="120"
                            required
                        >

                    </div>

                </div>



                <!-- =============================================
                     START BUTTON
                ============================================== -->

                <button
                    type="submit"
                    id="startExamBtn"
                    class="join-button"
                    disabled
                >

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    Checking Examination...

                </button>



                <!-- =============================================
                     MESSAGE
                ============================================== -->

                <div
                    id="joinMessage"
                    class="join-message"
                    role="alert"
                ></div>


            </form>



            <!-- =================================================
                 FOOTER
            ================================================== -->

            <div class="join-footer">

                © 2026 Gracextol CBT.
                All rights reserved.

            </div>


        </section>

    </main>



    <!-- =====================================================
         SUPABASE JAVASCRIPT
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================================
         GRACEXTOL SUPABASE CLIENT
    ====================================================== -->

    <script
        src="../../assets/js/supabase-client.js"
    ></script>


    <!-- =====================================================
         STUDENT JOIN JAVASCRIPT
    ====================================================== -->

    <script
        src="../js/join.js"
    ></script>


</body>

</html>
